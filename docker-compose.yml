services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bet_user
      POSTGRES_PASSWORD: bet_pass
      POSTGRES_DB: bet_db
    ports:
      - "5432:5432"
    volumes:
      - bet_pg_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bet_user -d bet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://bet_user:bet_pass@db:5432/bet_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  bet_pg_data:
